<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products - Shree Balaji Sweets</title>

    <link
        rel="stylesheet"
        href="products.css"
    >
</head>

<body>

    <div class="page">

        <!-- HEADER -->

        <header class="header">

            <button
                class="back-button"
                onclick="goBack()"
            >
                ←
            </button>

            <div class="header-title">

                <h1 id="categoryName">
                    Products
                </h1>

                <p id="categoryDescription">
                    Available items
                </p>

            </div>

        </header>


        <!-- PRODUCTS -->

        <main>

            <section
                id="productsContainer"
                class="products"
            >

                <div class="loading">

                    <div class="loader"></div>

                    <p>
                        Loading products...
                    </p>

                </div>

            </section>

        </main>


        <!-- FOOTER -->

        <footer class="footer">

            <div class="footer-name">
                Shree Balaji Sweets
            </div>

            <div class="footer-line">
                Freshness • Taste • Happiness
            </div>

            <div class="footer-hindi">
                हर खुशी में मिठास...
            </div>

        </footer>

    </div>


    <script src="products.js"></script>

</body>

</html>
